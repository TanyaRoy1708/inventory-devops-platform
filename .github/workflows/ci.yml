name: Application CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Test application
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: inventory_test
          POSTGRES_USER: inventory_app
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory_app -d inventory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: inventory_test
      DB_USER: inventory_app
      DB_PASSWORD: ci-only-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply test database migrations
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest -v

  secrets:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  source_scan:
    name: Scan application source
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: ".git,.venv,infra"
  build_image:
    name: Build container image
    needs: [tests, secrets, source_scan]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build application image
        run: docker build -t inventory-app:${{ github.sha }} .

      - name: Inspect installed Python packages
        run: docker run --rm inventory-app:${{ github.sha }} python -m pip list

      - name: Scan application image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: inventory-app:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
